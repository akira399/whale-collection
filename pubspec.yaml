name: ai_tool_collection
description: Local-first Android collection for AI tools and resources.
publish_to: none
version: 1.0.1+17

environment:
  sdk: ^3.13.7

dependencies:
  animations: ^2.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^10.0.0
  html: ^0.15.6
  http: ^1.5.0
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  reader_mode: ^0.2.3
  shared_preferences: ^2.5.3
  sqflite: ^2.4.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: '>=2.3.6 <2.4.0'

flutter:
  uses-material-design: true
  assets:
    - assets/images/whale_mascot.png
    - assets/images/whale_avatar.png
    - assets/fonts/OFL-NotoSerifSC.txt
  fonts:
    - family: SeaSaltSerif
      fonts:
        - asset: assets/fonts/sea-salt-serif.ttf
          weight: 600
